<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路線図 — 地図に忠実なインタラクティブ路線図</title>
    <meta name="description" content="国土数値情報の鉄道データをもとに、実際の地理座標で描いた検索できる路線図" />
    <!-- 左上のワードマーク用。使う4文字だけサブセットで読み込む -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap&text=%E8%B7%AF%E7%B7%9A%E3%83%9E%E3%83%83%E3%83%97" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="検索と絞り込み">
        <div class="sb-inner">
          <div class="sb-search">
            <input id="search" type="search" placeholder="路線・駅を検索（例: 銀座線、新宿）" autocomplete="off" enterkeyhint="search" />
          </div>
          <div id="chips" class="chips" aria-live="polite"></div>
          <div id="results" class="results" role="listbox"></div>
        </div>
      </aside>
      <main id="map-wrap">
        <div id="map" role="application" aria-label="地図"></div>
        <h1 class="brand"><span>路線マップ</span><span id="region-label" class="brand-sub"></span></h1>
        <div id="status" class="status">データを読み込み中…</div>
        <button id="reset" class="reset" type="button" title="選択を解除して全体を表示">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>リセット</span>
        </button>
        <button id="toggle-sidebar" class="fab" type="button" aria-expanded="true" aria-controls="sidebar" aria-label="検索">
          <svg class="ic-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20.5 20.5l-4.2-4.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
